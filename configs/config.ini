# IPDRS Configuration File

[data]
# Raw data paths
raw_data_dir = data/UNSW‑NB15
processed_data_dir = data/processed

# Data files
train_file = UNSW_NB15_training-set.csv
test_file = UNSW_NB15_testing-set.csv

[preprocessing]
# Preprocessing parameters
missing_value_threshold = 0.7
random_state = 42

[augmentation]
# GAN augmentation parameters
latent_dim = 100
gan_epochs = 5000
batch_size = 64
augmentation_multiplier = 1.5
use_adaptive_clipping = true

# SMOTE parameters
smote_ratio = 0.8
smote_k_neighbors = 5

[training]
# Model training parameters
random_state = 42
test_size = 0.2

# Random Forest
rf_n_estimators = 200
rf_max_depth = 15
rf_class_weight = balanced

# XGBoost
xgb_n_estimators = 200
xgb_max_depth = 6
xgb_learning_rate = 0.05
xgb_eval_metric = logloss

# LSTM
lstm_units = 64
lstm_dropout = 0.3
lstm_epochs = 50
lstm_batch_size = 32

# CNN
cnn_epochs = 50
cnn_batch_size = 32

[evaluation]
# Cross-validation parameters
n_splits = 5
stratified = true

# Metrics
compute_roc_auc = true
compute_f1_macro = true

[paths]
# Output paths
models_dir = trained_models
results_dir = results
logs_dir = results/logs
tensorboard_dir = tensorboard_logs

[ips]
# Real-time IPS settings
alert_threshold = 0.7
buffer_size = 1000
